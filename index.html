<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Supporters Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --church: #d97706;      /* amber  - churches */
    --person: #2563eb;      /* blue   - individuals */
    --ink: #1f2937;
    --muted: #6b7280;
    --panel: #ffffff;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #wrap { position: relative; height: 100%; min-height: 420px; }
  #map { position: absolute; inset: 0; background: #e8eef3; }

  .panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px;
    width: 260px; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); padding: 12px 14px; font-size: 14px;
  }
  .panel h1 { font-size: 16px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { cursor: pointer; flex: 1; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .dot.church { background: var(--church); }
  .dot.person { background: var(--person); }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 10px 0 4px; }
  .seg button {
    flex: 1; padding: 7px 0; border: 0; background: #f9fafb; font: inherit; cursor: pointer; color: var(--ink);
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.35; }
  #banner {
    display: none; position: absolute; z-index: 1000; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #fffbeb; border: 1px solid #fcd34d; color: #78350f; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: calc(100% - 24px);
  }
  .leaflet-popup-content { font-size: 14px; }
  .leaflet-popup-content b { display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="map" aria-label="Map of supporters"></div>

  <div class="panel">
    <h1>Our Supporters</h1>

    <div class="row">
      <input type="checkbox" id="showChurch" checked>
      <span class="dot church"></span>
      <label for="showChurch">Churches</label>
      <span class="count" id="nChurch">0</span>
    </div>
    <div class="row">
      <input type="checkbox" id="showPerson" checked>
      <span class="dot person"></span>
      <label for="showPerson">Individuals</label>
      <span class="count" id="nPerson">0</span>
    </div>

    <div class="seg" role="group" aria-label="Map style">
      <button id="modePins" aria-pressed="true">Pins</button>
      <button id="modeHeat" aria-pressed="false">Heatmap</button>
    </div>

    <div class="note">Locations are approximate (rounded to roughly a mile) to protect supporter privacy.</div>
  </div>

  <div id="banner"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
/* ============================================================
   SETTINGS - the only part you normally need to edit
   ============================================================ */
const CONFIG = {
  // Public URL of the JSON feed your Zap keeps up to date.
  // Leave as "" to preview with built-in SAMPLE data.
  FEED_URL: "feed.json",   // on GitHub Pages use "feed.json"

  // How often the page re-reads the feed while someone has it open (minutes). 0 = never.
  REFRESH_MINUTES: 30,

  // Privacy safety net: coordinates are rounded to this many decimals in the browser,
  // even if the feed contains more precise ones. 2 decimals is about 1 km / 0.7 mile.
  COORD_DECIMALS: 2,

  // Starting view if there are no points yet.
  DEFAULT_CENTER: [39.5, -98.35],
  DEFAULT_ZOOM: 4
};
/* ============================================================ */

const COLORS = { church: "#d97706", person: "#2563eb" };

/* ---------- Feed format ----------
   A JSON array. One object per supporter, NO names or street addresses:
   [ { "type": "church"|"individual", "lat": 41.88, "lng": -87.63, "city": "Chicago", "state": "IL" }, ... ]
   "type" is "church" when the supporter is in the REACH group named "church", otherwise "individual".
*/

function normalize(rows) {
  const d = CONFIG.COORD_DECIMALS, out = [];
  (Array.isArray(rows) ? rows : []).forEach(r => {
    const lat = parseFloat(r.lat), lng = parseFloat(r.lng);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
    const t = String(r.type || "").trim().toLowerCase();
    out.push({
      type: t === "church" ? "church" : "person",
      lat: +lat.toFixed(d),
      lng: +lng.toFixed(d),
      city: r.city ? String(r.city) : "",
      state: r.state ? String(r.state) : ""
    });
  });
  return out;
}

/* ---------- Sample data (clearly flagged on screen) ---------- */
function sampleData() {
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const hubs = [
    ["Chicago","IL",41.88,-87.63],["Dallas","TX",32.78,-96.80],["Atlanta","GA",33.75,-84.39],
    ["Denver","CO",39.74,-104.99],["Nashville","TN",36.16,-86.78],["Columbus","OH",39.96,-83.00],
    ["Charlotte","NC",35.23,-80.84],["Phoenix","AZ",33.45,-112.07],["Minneapolis","MN",44.98,-93.27],
    ["Seattle","WA",47.61,-122.33]
  ];
  const rows = [];
  hubs.forEach(h => {
    const n = 6 + Math.floor(rnd() * 12);
    for (let i = 0; i < n; i++) {
      rows.push({
        type: rnd() < 0.22 ? "church" : "individual",
        lat: h[2] + (rnd() - .5) * 0.9, lng: h[3] + (rnd() - .5) * 0.9,
        city: h[0], state: h[1]
      });
    }
  });
  return rows;
}

/* ---------- Map ---------- */
const map = L.map("map", { worldCopyJump: true }).setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const pinLayer = L.layerGroup().addTo(map);
let heatLayer = null;
let points = [];
let mode = "pins";
let firstFit = true;

const $ = id => document.getElementById(id);

function visiblePoints() {
  const c = $("showChurch").checked, p = $("showPerson").checked;
  return points.filter(pt => (pt.type === "church" ? c : p));
}

function render() {
  const vis = visiblePoints();

  pinLayer.clearLayers();
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }

  if (mode === "pins") {
    vis.forEach(pt => {
      const isChurch = pt.type === "church";
      const m = L.circleMarker([pt.lat, pt.lng], {
        radius: isChurch ? 8 : 6,
        color: "#ffffff", weight: 1.5,
        fillColor: COLORS[pt.type], fillOpacity: 0.8
      });
      const place = [pt.city, pt.state].filter(Boolean).join(", ");
      m.bindPopup("<b>" + (isChurch ? "Church partner" : "Individual supporter") + "</b>" + (place ? escapeHtml(place) : "Approximate location"));
      m.addTo(pinLayer);
    });
  } else {
    heatLayer = L.heatLayer(vis.map(pt => [pt.lat, pt.lng, 1]), {
      radius: 28, blur: 22, maxZoom: 9, minOpacity: 0.35
    }).addTo(map);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function setData(rows, isSample) {
  points = normalize(rows);
  $("nChurch").textContent = points.filter(p => p.type === "church").length;
  $("nPerson").textContent = points.filter(p => p.type === "person").length;

  const b = $("banner");
  if (isSample) {
    b.textContent = "Showing SAMPLE data. Set CONFIG.FEED_URL in this file to show real supporters.";
    b.style.display = "block";
  } else {
    b.style.display = "none";
  }

  if (firstFit && points.length) {
    map.fitBounds(L.latLngBounds(points.map(p => [p.lat, p.lng])).pad(0.15), { maxZoom: 10 });
    firstFit = false;
  }
  render();
}

function setMode(m) {
  mode = m;
  $("modePins").setAttribute("aria-pressed", m === "pins");
  $("modeHeat").setAttribute("aria-pressed", m === "heat");
  render();
}

async function load() {
  if (!CONFIG.FEED_URL) { setData(sampleData(), true); return; }
  try {
    const res = await fetch(CONFIG.FEED_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setData(await res.json(), false);
  } catch (e) {
    console.error("Could not load supporter feed:", e);
    // Never fall back to sample data on a live feed: fake supporters on a public page would mislead visitors.
    $("banner").textContent = points.length
      ? "Could not refresh the data right now. Showing the last data available."
      : "The supporter data could not be loaded right now. Please try again later.";
    $("banner").style.display = "block";
  }
}

$("showChurch").addEventListener("change", render);
$("showPerson").addEventListener("change", render);
$("modePins").addEventListener("click", () => setMode("pins"));
$("modeHeat").addEventListener("click", () => setMode("heat"));

load();
if (CONFIG.FEED_URL && CONFIG.REFRESH_MINUTES > 0) {
  setInterval(load, CONFIG.REFRESH_MINUTES * 60 * 1000);
}
</script>
</body>
</html>
